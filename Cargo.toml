[package]
name = "sootmark-plist"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Reader of Apple property lists for forensics: binary (bplist00) and XML, every object type, NSKeyedArchiver archives resolved, damage reported rather than fatal."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/plist"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "plist", "macos"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "plist"

[dependencies]
# Ts, for dates.
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
